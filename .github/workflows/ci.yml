name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
      functions: ${{ steps.check.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          echo "app=$([ -f app/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "functions=$([ -f functions/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  flutter:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Generar código (si usa build_runner)
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Cobertura de módulos críticos (≥ 90 %)
        run: dart run tool/coverage_gate.dart

  apk-dev:
    needs: [detect, flutter]
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build apk --flavor dev -t lib/main_dev.dart --debug
      - uses: actions/upload-artifact@v4
        with:
          name: vantia-dev-apk
          path: app/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14

  apk-demo:
    needs: [detect, flutter]
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # APK de demostración: sin Firebase, datos de ejemplo. Firmado con la
      # clave debug (instalable directamente, no apto para Play).
      - run: flutter build apk --flavor demo -t lib/main_demo.dart --release
      - uses: actions/upload-artifact@v4
        with:
          name: vantia-demo-apk
          path: app/build/app/outputs/flutter-apk/app-demo-release.apk
          retention-days: 30

  functions:
    needs: detect
    if: needs.detect.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests de integración (emuladores + reglas)
        run: npm run test:emulator
